# Base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/siman_bd
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#context
server.servlet.context-path=/api/v1
server.port=9191


spring.data.web.pageable.page-parameter=p
spring.data.web.pageable.size-parameter=limit
security-default-role=CUSTOMER
security-jwt-expiration-in-minutes=30
security-secret-key-signed=X9lpM3kPmwEoscw2gHsNjNvU3wNgi5L5mGsQmuMoBcj9S3RuSqxI

server.tomcat.remote_ip_header=x-forwarded-for
server.tomcat.protocol_header=x-forwarded-proto


